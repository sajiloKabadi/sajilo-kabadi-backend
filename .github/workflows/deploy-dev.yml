name: Deploy (dev)

on:
  push:
    branches: [develop]
  # "Run workflow" button, e.g. to redeploy after fixing the server.
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy
# half-way through.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: sajilokabadi-api
  DEPLOY_DIR: /opt/sajilokabadi

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same checks as the pre-commit hook, in case a commit skipped it.
      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Django checks and tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: sqlite:///ci.sqlite3
          SECRET_KEY: ci-only-not-secret
        run: |
          python manage.py check
          python manage.py test --noinput

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR needs lowercase
          repo="ghcr.io/${owner}/${IMAGE_NAME}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:develop
          # Links the package to this repository, which lets GITHUB_TOKEN
          # read it on later runs.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      # A repository variable API_DOMAIN overrides this if the hostname changes.
      API_DOMAIN: ${{ vars.API_DOMAIN || 'api.sajilokabadi.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY API_DOMAIN; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 15
          EOF

      - name: Upload compose file and scripts
        run: |
          scp -q deploy/docker-compose.yml deploy/compose.sh deploy/deploy.sh deploy/rollback.sh deploy/backup.sh "ec2:${DEPLOY_DIR}/"
          ssh ec2 "chmod +x ${DEPLOY_DIR}/*.sh"

      - name: Log EC2 in to GHCR
        # Token goes over stdin, never on a command line or in the log.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | ssh ec2 "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && echo 'GHCR login ok'"

      - name: Pull, migrate, switch
        run: ssh ec2 "${DEPLOY_DIR}/deploy.sh '${IMAGE}'"

      - name: Log EC2 out of GHCR
        if: always()
        run: ssh ec2 "docker logout ghcr.io >/dev/null 2>&1 || true"

      - name: Public health check
        run: |
          url="https://${API_DOMAIN}/health/"
          echo "GET $url"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "$url"
          echo

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Deployed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "https://${API_DOMAIN}/health/ is healthy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Deploy of \`${IMAGE}\` failed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the step logs above. Roll back with \`${DEPLOY_DIR}/rollback.sh\` on the server if needed." >> "$GITHUB_STEP_SUMMARY"
          fi
