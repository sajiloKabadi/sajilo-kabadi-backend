# /etc/nginx/sites-available/sajilokabadi-api
#
# After copying, run
#   sudo certbot --nginx -d api.sajilokabadi.com --redirect
# Certbot adds the `listen 443 ssl` lines, the certificate paths, and a
# separate port-80 block that redirects to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name api.sajilokabadi.com;

    # Avatar uploads; keep in step with anything the API accepts.
    client_max_body_size 10M;

    # User uploads, written by the API container into /opt/sajilokabadi/media.
    location /media/ {
        alias /opt/sajilokabadi/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the API rate-limits OTP requests per IP
        # and trusts the first X-Forwarded-For entry, so clients must not be
        # able to inject their own.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
