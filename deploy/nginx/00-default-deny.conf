# /etc/nginx/sites-available/00-default-deny
#
# Catch-all for every request that is not for api.sajilokabadi.com:
# the bare EC2 IP, old DNS names, scanners. The connection is closed without
# a response, so the API is only reachable through its hostname.
#
# HTTPS is refused during the TLS handshake (ssl_reject_handshake), so no
# certificate is needed and the real hostname is never revealed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    access_log off;

    # 444: nginx-specific "close the connection, send nothing".
    return 444;
}
