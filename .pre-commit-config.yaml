# Runs on every `git commit`. One-time setup:
#   pip install -r requirements-dev.txt
#   pre-commit install
# Run on everything:  pre-commit run --all-files
# Update hook versions: pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # .env is gitignored; this also stops it being force-added (git add -f).
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        entry: .env files must never be committed (secrets live on the server only)
        language: fail
        files: (^|/)\.env$
